<svg viewBox="0 0 1200 300" xmlns="http://w3.org">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo con bordes redondeados usando relleno directo -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Ondas de Audio usando atributos nativos de opacidad y color -->
  <path d="M0,190 C300,290 500,100 800,220 L1200,120 L1200,300 L0,300 Z" fill="#312e81" opacity="0.4"/>
  <path d="M0,230 C400,310 700,150 950,260 L1200,190 L1200,300 L0,300 Z" fill="#1e1b4b" opacity="0.7"/>
  <path d="M0,150 Q150,90 300,150 T600,150 T900,150 T1200,150" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.3"/>
  <path d="M0,170 Q200,210 400,170 T800,170 T1200,170" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Textos con tipografía, tamaño y alineación integrada de forma segura -->
  <text x="50%" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="82px" font-weight="900" fill="#ffffff" letter-spacing="6px" text-anchor="middle">WILLPOVOICE</text>
  <text x="50%" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="22px" font-weight="500" fill="#94a3b8" letter-spacing="2px" text-anchor="middle">DYNAMIC TTS ENGINE</text>
</svg>
