[project]
name = "naturalvoice-tts"
version = "0.1.0"
description = "Aplicación de escritorio TTS basada en NaturalVoiceSAPIAdapter"
authors = [
    { name = "Tu Nombre" }
]
requires-python = ">=3.11"

dependencies = [
    "PySide6>=6.6",
    "pywin32>=306",
    "comtypes>=1.2",
    "pyttsx3>=2.90",
    "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = [
    "tests"
]